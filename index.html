<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172554">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Lista zakupów</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root { --navy: #172554; --primary: #1e3a8a; --accent: #2563eb; --bg: #f1f4fa; --card: #fff;
            --text: #111827; --muted: #6b7280; --track: #dbe3f3; --danger: #c62828; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--text); }
    header { position: sticky; top: 0; z-index: 2; }
    .bar { background: linear-gradient(135deg, var(--navy), var(--primary)); color: #fff;
           padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; }
    header h1 { margin: 0; font-size: 1.25rem; }
    header .bar button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.5);
                         border-radius: 8px; padding: 6px 10px; font-size: .85rem; cursor: pointer; }
    .tabs-wrap { background: #fff; padding: 8px 16px; border-bottom: 1px solid var(--track);
                 box-shadow: 0 2px 6px rgba(15,23,42,.06); }
    nav.tabs { display: flex; gap: 4px; max-width: 528px; margin: 0 auto; padding: 4px;
               background: #e8edf7; border-radius: 12px; }
    nav.tabs button { flex: 1; background: none; border: 0; border-radius: 9px; color: var(--muted);
                      font-size: .95rem; padding: 8px 0; cursor: pointer; transition: background .15s, color .15s; }
    nav.tabs button.active { background: #fff; color: var(--primary); font-weight: 600;
                             box-shadow: 0 1px 3px rgba(15,23,42,.15); }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    .hidden { display: none !important; }
    form.add { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type=text], input[type=email], input[type=password] {
      flex: 1; padding: 12px; font-size: 1rem; border: 1px solid #c7cfdd; border-radius: 10px; width: 100%; }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
    button.primary { background: var(--primary); color: #fff; border: 0; border-radius: 10px;
                     padding: 12px 16px; font-size: 1rem; cursor: pointer; }
    button.primary:disabled { opacity: .6; cursor: default; }
    ul { list-style: none; margin: 0; padding: 0; }
    #todo li, #done li { background: var(--card); border-radius: 10px; margin-bottom: 8px; display: flex;
         align-items: center; padding: 4px 8px 4px 4px; box-shadow: 0 1px 2px rgba(15,23,42,.08); }
    li label { flex: 1; display: flex; align-items: center; gap: 12px; padding: 10px; cursor: pointer;
               font-size: 1.05rem; word-break: break-word; }
    li input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); flex-shrink: 0; }
    li.done label span { text-decoration: line-through; color: var(--muted); }
    .handle { background: none; border: 0; color: #9aa6bd; padding: 8px; display: flex;
              align-items: center; cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
    .handle:focus-visible { outline: 2px solid var(--accent); border-radius: 6px; }
    #todo li.dragging { position: relative; z-index: 1; transform: scale(1.02); cursor: grabbing;
                        box-shadow: 0 8px 20px rgba(15,23,42,.22); outline: 2px solid var(--accent); }
    #todo li.dragging .handle { cursor: grabbing; color: var(--accent); }
    body.is-dragging { user-select: none; -webkit-user-select: none; }
    .del { background: none; border: 0; font-size: 1.2rem; color: var(--danger); cursor: pointer; padding: 8px; }
    .section { display: flex; justify-content: space-between; align-items: center;
               margin: 20px 0 8px; color: var(--muted); font-size: .9rem; }
    .section button { background: none; border: 0; color: var(--danger); cursor: pointer; font-size: .9rem; }
    .empty { text-align: center; color: var(--muted); padding: 24px 0; }
    .progress { margin-bottom: 16px; }
    .progress-text { display: flex; justify-content: space-between; font-size: .9rem;
                     color: var(--muted); margin-bottom: 6px; }
    .progress-text strong { color: var(--text); }
    .progress-bar { height: 10px; background: var(--track); border-radius: 999px; overflow: hidden; }
    .progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, var(--primary), var(--accent));
                     border-radius: 999px; transition: width .3s ease; }
    .login { display: flex; flex-direction: column; gap: 10px; margin-top: 40px; }
    .error { color: var(--danger); font-size: .9rem; min-height: 1.2em; }

    /* Podpowiedzi produktów */
    .ac { position: relative; flex: 1; display: flex; }
    #suggest { position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 3; background: #fff;
               border-radius: 10px; box-shadow: 0 6px 20px rgba(15,23,42,.18); overflow: hidden; }
    #suggest li { display: flex; align-items: center; border-bottom: 1px solid #eef1f7; }
    #suggest li:last-child { border-bottom: 0; }
    #suggest li .pick { flex: 1; text-align: left; background: none; border: 0; padding: 12px;
                        font-size: 1rem; cursor: pointer; color: var(--text); }
    #suggest li.active, #suggest li:hover { background: #eaf0fd; }
    #suggest li .pick mark { background: none; color: var(--primary); font-weight: 700; }
    #suggest li .forget { background: none; border: 0; color: var(--muted); padding: 12px; cursor: pointer; }

    /* Karty klienta */
    form.card-add { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 16px;
                    display: flex; flex-direction: column; gap: 8px; box-shadow: 0 1px 2px rgba(15,23,42,.08); }
    form.card-add .row { display: flex; gap: 8px; }
    .file-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px;
                border: 1px dashed var(--accent); border-radius: 10px; color: var(--primary); cursor: pointer;
                font-size: .95rem; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .file-btn input { display: none; }
    #cardPreview { max-height: 160px; max-width: 100%; align-self: center; border-radius: 8px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .cards li { background: var(--card); border-radius: 12px; overflow: hidden; cursor: pointer;
                box-shadow: 0 1px 3px rgba(15,23,42,.12); }
    .cards li img { display: block; width: 100%; height: 120px; object-fit: cover; object-position: center;
                    background: #e5e9f2; }
    .cards li div { padding: 10px; font-weight: 600; color: var(--primary); word-break: break-word; }
    .viewer { position: fixed; inset: 0; z-index: 10; background: #fff; display: flex; flex-direction: column; }
    .viewer .vbar { display: flex; align-items: center; gap: 8px; padding: 12px 16px;
                    background: var(--navy); color: #fff; }
    .viewer .vbar h2 { flex: 1; margin: 0; font-size: 1.1rem; word-break: break-word; }
    .viewer .vbar button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.5);
                           border-radius: 8px; padding: 6px 10px; font-size: .85rem; cursor: pointer; }
    .viewer .vbar button.danger { border-color: #fca5a5; color: #fca5a5; }
    .viewer .vimg { flex: 1; display: flex; align-items: center; justify-content: center;
                    padding: 8px; overflow: auto; }
    .viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
  </style>
</head>
<body>
  <header>
    <div class="bar">
      <h1>🛒 Lista zakupów</h1>
      <button id="logout" class="hidden">Wyloguj</button>
    </div>
    <div id="tabsWrap" class="tabs-wrap hidden">
      <nav id="tabs" class="tabs">
        <button data-tab="list" class="active">Lista</button>
        <button data-tab="cards">Karty</button>
      </nav>
    </div>
  </header>

  <main>
    <form id="login" class="login hidden">
      <input type="email" id="email" placeholder="E-mail" autocomplete="username" required>
      <input type="password" id="password" placeholder="Hasło" autocomplete="current-password" required>
      <button class="primary" type="submit">Zaloguj</button>
      <div class="error" id="loginError"></div>
    </form>

    <div id="app" class="hidden">
      <section id="tab-list">
        <form id="addForm" class="add">
          <div class="ac">
            <input type="text" id="newItem" placeholder="Dodaj produkt…" autocomplete="off" required
                   role="combobox" aria-autocomplete="list" aria-controls="suggest" aria-expanded="false">
            <ul id="suggest" role="listbox" class="hidden"></ul>
          </div>
          <button class="primary" type="submit">Dodaj</button>
        </form>
        <div id="progress" class="progress hidden">
          <div class="progress-text">
            <strong id="progressLeft"></strong>
            <span id="progressCount"></span>
          </div>
          <div class="progress-bar" role="progressbar" aria-label="Postęp zakupów"
               aria-valuemin="0" id="progressBar">
            <div class="progress-fill" id="progressFill"></div>
          </div>
        </div>
        <ul id="todo"></ul>
        <div id="emptyMsg" class="empty hidden">Lista jest pusta 🎉</div>
        <div id="doneHeader" class="section hidden">
          <span>Kupione</span>
          <button id="clearDone">Usuń kupione</button>
        </div>
        <ul id="done"></ul>
      </section>

      <section id="tab-cards" class="hidden">
        <form id="cardForm" class="card-add">
          <input type="text" id="cardName" placeholder="Nazwa sklepu, np. Biedronka" maxlength="50" required>
          <img id="cardPreview" class="hidden" alt="Podgląd karty">
          <div class="row">
            <label class="file-btn"><span id="cardFileLabel">📷 Wybierz screen karty</span>
              <input type="file" id="cardFile" accept="image/*">
            </label>
            <button class="primary" type="submit" id="cardSave">Zapisz</button>
          </div>
          <div class="error" id="cardError"></div>
        </form>
        <ul id="cards" class="cards"></ul>
        <div id="cardsEmpty" class="empty hidden">Nie masz jeszcze żadnych kart.<br>Dodaj screen karty klienta powyżej.</div>
      </section>
    </div>
  </main>

  <div id="viewer" class="viewer hidden" role="dialog" aria-modal="true" aria-labelledby="viewerName">
    <div class="vbar">
      <h2 id="viewerName"></h2>
      <button id="viewerDelete" class="danger">Usuń</button>
      <button id="viewerClose">Zamknij</button>
    </div>
    <div class="vimg"><img id="viewerImg" alt=""></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { initializeFirestore, persistentLocalCache, collection, addDoc, updateDoc, deleteDoc, setDoc,
             doc, onSnapshot, query, orderBy, serverTimestamp, writeBatch, increment }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    // Lokalny cache: lista i karty działają też w sklepie przy słabym zasięgu
    const db = initializeFirestore(app, { localCache: persistentLocalCache() });
    const itemsCol = collection(db, "items");
    const productsCol = collection(db, "products");
    const cardsCol = collection(db, "cards");

    const $ = (id) => document.getElementById(id);
    let unsubs = [];
    let currentItems = [];
    let products = [];
    let cards = [];

    onAuthStateChanged(auth, (user) => {
      $("login").classList.toggle("hidden", !!user);
      $("app").classList.toggle("hidden", !user);
      $("logout").classList.toggle("hidden", !user);
      $("tabsWrap").classList.toggle("hidden", !user);
      unsubs.forEach((u) => u());
      unsubs = [];
      if (!user) return;
      unsubs.push(onSnapshot(query(itemsCol, orderBy("createdAt", "asc")), (snap) => {
        currentItems = snap.docs.map((d) => ({ id: d.id, ...d.data() }))
          .sort((a, b) => sortKey(a) - sortKey(b));
        // W trakcie przeciągania nie przebudowujemy listy – odświeżymy ją po upuszczeniu
        if (!drag) render();
      }));
      unsubs.push(onSnapshot(productsCol, (snap) => {
        products = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        if (document.activeElement === $("newItem")) renderSuggestions();
      }));
      unsubs.push(onSnapshot(query(cardsCol, orderBy("createdAt", "asc")), (snap) => {
        cards = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
        renderCards();
      }));
    });

    $("login").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("loginError").textContent = "";
      try {
        await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
      } catch {
        $("loginError").textContent = "Nieprawidłowy e-mail lub hasło.";
      }
    });

    $("logout").addEventListener("click", () => signOut(auth));

    // ---------- Zakładki ----------
    function showTab(tab) {
      document.querySelectorAll("#tabs button").forEach((b) =>
        b.classList.toggle("active", b.dataset.tab === tab));
      $("tab-list").classList.toggle("hidden", tab !== "list");
      $("tab-cards").classList.toggle("hidden", tab !== "cards");
      localStorage.setItem("tab", tab);
    }
    document.querySelectorAll("#tabs button").forEach((b) =>
      b.addEventListener("click", () => showTab(b.dataset.tab)));
    showTab(localStorage.getItem("tab") === "cards" ? "cards" : "list");

    // ---------- Lista ----------
    function addItem(name) {
      name = name.trim().replace(/\s+/g, " ");
      if (!name) return;
      addDoc(itemsCol, { name, done: false, order: Date.now(), createdAt: serverTimestamp() });
      rememberProduct(name);
      $("newItem").value = "";
      $("newItem").focus();
      renderSuggestions();
    }

    $("addForm").addEventListener("submit", (e) => {
      e.preventDefault();
      addItem($("newItem").value);
    });

    $("clearDone").addEventListener("click", () => {
      const done = currentItems.filter((i) => i.done);
      if (!done.length || !confirm(`Usunąć ${done.length} kupionych produktów?`)) return;
      const batch = writeBatch(db);
      done.forEach((i) => batch.delete(doc(db, "items", i.id)));
      batch.commit();
    });

    function itemEl(item) {
      const li = document.createElement("li");
      li.className = item.done ? "done" : "";
      li.dataset.id = item.id;
      let handle = null;
      if (!item.done) {
        handle = document.createElement("button");
        handle.type = "button";
        handle.className = "handle";
        handle.innerHTML = MOVE_ICON;
        handle.title = "Przeciągnij, aby zmienić kolejność";
        handle.setAttribute("aria-label", `Zmień kolejność: ${item.name} (strzałki góra/dół)`);
        handle.addEventListener("pointerdown", (e) => startDrag(e, li));
        handle.addEventListener("keydown", (e) => {
          if (e.key === "ArrowUp" || e.key === "ArrowDown") {
            e.preventDefault();
            moveBy(item.id, e.key === "ArrowUp" ? -1 : 1);
          }
        });
      }
      const label = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!item.done;
      cb.addEventListener("change", () => updateDoc(doc(db, "items", item.id), { done: cb.checked }));
      const span = document.createElement("span");
      span.textContent = item.name;
      label.append(cb, span);
      const del = document.createElement("button");
      del.className = "del";
      del.title = "Usuń";
      del.textContent = "✕";
      del.addEventListener("click", () => deleteDoc(doc(db, "items", item.id)));
      li.append(label, ...(handle ? [handle] : []), del);
      return li;
    }

    // Strzałki w górę i w dół (SVG, żeby wyglądały tak samo na każdym telefonie)
    const MOVE_ICON = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M8 3v18M4 7l4-4 4 4M16 21V3M12 17l4 4 4-4"/></svg>`;

    function render() {
      const todo = currentItems.filter((i) => !i.done);
      const done = currentItems.filter((i) => i.done);
      $("todo").replaceChildren(...todo.map(itemEl));
      $("done").replaceChildren(...done.map(itemEl));
      $("emptyMsg").classList.toggle("hidden", todo.length > 0);
      $("doneHeader").classList.toggle("hidden", done.length === 0);
      renderProgress(todo.length, currentItems.length);
    }

    // ---------- Zmiana kolejności (przeciąganie) ----------
    // Kolejność = pole "order"; starsze produkty bez niego układają się wg daty dodania
    function sortKey(item) {
      return item.order ?? item.createdAt?.toMillis?.() ?? Number.MAX_SAFE_INTEGER;
    }

    // Zapisuje nowe miejsce produktu na podstawie docelowej kolejności id na liście "do kupienia".
    // Nowe "order" to środek między sąsiadami, więc zmienia się tylko jeden dokument.
    function placeItem(id, ids) {
      const byId = new Map(currentItems.map((i) => [i.id, i]));
      const idx = ids.indexOf(id);
      const prev = byId.get(ids[idx - 1]), next = byId.get(ids[idx + 1]);
      const item = byId.get(id);
      if (!item) return;
      let order;
      if (prev && next) order = (sortKey(prev) + sortKey(next)) / 2;
      else if (prev) order = sortKey(prev) + 1000;
      else if (next) order = sortKey(next) - 1000;
      else return;
      const oldIds = currentItems.filter((i) => !i.done).map((i) => i.id);
      if (oldIds.join() === ids.join()) return;
      item.order = order;
      currentItems.sort((a, b) => sortKey(a) - sortKey(b));
      updateDoc(doc(db, "items", id), { order });
    }

    function moveBy(id, delta) {
      const ids = currentItems.filter((i) => !i.done).map((i) => i.id);
      const from = ids.indexOf(id), to = from + delta;
      if (from < 0 || to < 0 || to >= ids.length) return;
      ids.splice(to, 0, ids.splice(from, 1)[0]);
      placeItem(id, ids);
      render();
      document.querySelector(`#todo li[data-id="${CSS.escape(id)}"] .handle`)?.focus();
    }

    let drag = null;

    function startDrag(e, li) {
      if (drag || (e.pointerType === "mouse" && e.button !== 0)) return;
      e.preventDefault();
      e.currentTarget.setPointerCapture(e.pointerId);
      drag = { li, id: li.dataset.id, y: e.clientY, pointerId: e.pointerId };
      li.classList.add("dragging");
      document.body.classList.add("is-dragging");
      requestAnimationFrame(autoScroll);
    }

    // Wstawia przeciągany element przed pierwszym, którego środek jest poniżej palca
    function reposition() {
      const list = $("todo");
      const before = [...list.children].find((el) => {
        if (el === drag.li) return false;
        const r = el.getBoundingClientRect();
        return drag.y < r.top + r.height / 2;
      });
      if (before) {
        if (drag.li.nextElementSibling !== before) list.insertBefore(drag.li, before);
      } else if (list.lastElementChild !== drag.li) {
        list.append(drag.li);
      }
    }

    // Przewijanie strony, gdy palec jest przy górnej/dolnej krawędzi ekranu
    function autoScroll() {
      if (!drag) return;
      const top = document.querySelector("header").getBoundingClientRect().bottom;
      const edge = 60;
      let dy = 0;
      if (drag.y < top + edge) dy = -Math.ceil((top + edge - drag.y) / 6);
      else if (drag.y > innerHeight - edge) dy = Math.ceil((drag.y - innerHeight + edge) / 6);
      if (dy) { scrollBy(0, dy); reposition(); }
      requestAnimationFrame(autoScroll);
    }

    function endDrag(e) {
      if (!drag || e.pointerId !== drag.pointerId) return;
      const { li, id } = drag;
      drag = null;
      li.classList.remove("dragging");
      document.body.classList.remove("is-dragging");
      placeItem(id, [...$("todo").children].map((el) => el.dataset.id));
      render();
    }

    document.addEventListener("pointermove", (e) => {
      if (!drag || e.pointerId !== drag.pointerId) return;
      drag.y = e.clientY;
      reposition();
    });
    document.addEventListener("pointerup", endDrag);
    document.addEventListener("pointercancel", endDrag);

    // Polska odmiana: 1 produkt, 2–4 produkty, 5+ produktów (ale 22 produkty, 12 produktów)
    function plural(n, one, few, many) {
      if (n === 1) return one;
      const d = n % 10, dd = n % 100;
      return d >= 2 && d <= 4 && (dd < 12 || dd > 14) ? few : many;
    }

    function renderProgress(left, total) {
      $("progress").classList.toggle("hidden", total === 0);
      if (total === 0) return;
      const bought = total - left;
      $("progressLeft").textContent = left === 0
        ? "Wszystko kupione ✅"
        : `${plural(left, "Został", "Zostały", "Zostało")} ${left} ${plural(left, "produkt", "produkty", "produktów")}`;
      $("progressCount").textContent = `${bought} / ${total}`;
      $("progressFill").style.width = `${(bought / total) * 100}%`;
      $("progressBar").setAttribute("aria-valuemax", total);
      $("progressBar").setAttribute("aria-valuenow", bought);
    }

    // ---------- Zapamiętywanie produktów i podpowiedzi ----------
    // Klucz bez wielkości liter i polskich znaków: "Żółty ser" i "zolty ser" to ten sam produkt
    const fold = (s) => s.toLocaleLowerCase("pl").replace(/ł/g, "l")
      .normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim();
    const productId = (name) => encodeURIComponent(fold(name));

    function rememberProduct(name) {
      setDoc(doc(db, "products", productId(name)),
        { name, count: increment(1), lastUsed: serverTimestamp() }, { merge: true });
    }

    let suggestions = [];
    let activeIdx = -1;

    function renderSuggestions() {
      const input = $("newItem");
      const q = fold(input.value);
      const onList = new Set(currentItems.filter((i) => !i.done).map((i) => fold(i.name)));
      suggestions = !q ? [] : products
        .map((p) => ({ ...p, key: fold(p.name) }))
        .filter((p) => p.key.includes(q) && p.key !== q && !onList.has(p.key))
        .sort((a, b) => (b.key.startsWith(q) - a.key.startsWith(q))
          || ((b.count || 0) - (a.count || 0)) || a.name.localeCompare(b.name, "pl"))
        .slice(0, 6);
      activeIdx = -1;
      $("suggest").replaceChildren(...suggestions.map((p, i) => {
        const li = document.createElement("li");
        li.setAttribute("role", "option");
        const pick = document.createElement("button");
        pick.type = "button";
        pick.className = "pick";
        // Pogrubienie dopasowanego fragmentu (długość klucza = długość nazwy, poza zwielokrotnionymi spacjami)
        const at = p.key.indexOf(q);
        if (p.key.length === p.name.length && at >= 0) {
          const mark = document.createElement("mark");
          mark.textContent = p.name.slice(at, at + q.length);
          pick.append(p.name.slice(0, at), mark, p.name.slice(at + q.length));
        } else {
          pick.textContent = p.name;
        }
        pick.addEventListener("click", () => addItem(p.name));
        const forget = document.createElement("button");
        forget.type = "button";
        forget.className = "forget";
        forget.title = "Zapomnij ten produkt";
        forget.textContent = "✕";
        forget.addEventListener("click", () => deleteDoc(doc(db, "products", p.id)));
        li.append(pick, forget);
        li.dataset.idx = i;
        return li;
      }));
      const open = suggestions.length > 0;
      $("suggest").classList.toggle("hidden", !open);
      input.setAttribute("aria-expanded", open);
    }

    function hideSuggestions() {
      suggestions = [];
      $("suggest").classList.add("hidden");
      $("newItem").setAttribute("aria-expanded", "false");
    }

    function highlight(idx) {
      activeIdx = idx;
      [...$("suggest").children].forEach((li, i) => li.classList.toggle("active", i === idx));
    }

    $("newItem").addEventListener("input", renderSuggestions);
    $("newItem").addEventListener("focus", renderSuggestions);
    $("newItem").addEventListener("blur", hideSuggestions);
    // Klik w podpowiedź nie zabiera fokusu z pola (klawiatura na telefonie się nie chowa)
    $("suggest").addEventListener("pointerdown", (e) => e.preventDefault());
    $("newItem").addEventListener("keydown", (e) => {
      if (!suggestions.length) return;
      if (e.key === "ArrowDown") { e.preventDefault(); highlight((activeIdx + 1) % suggestions.length); }
      else if (e.key === "ArrowUp") { e.preventDefault(); highlight((activeIdx - 1 + suggestions.length) % suggestions.length); }
      else if (e.key === "Enter" && activeIdx >= 0) { e.preventDefault(); addItem(suggestions[activeIdx].name); }
      else if (e.key === "Escape") hideSuggestions();
    });

    // ---------- Karty klienta ----------
    // Screen jest zmniejszany i kompresowany do JPEG, żeby zmieścił się w dokumencie Firestore (limit 1 MB)
    const MAX_IMAGE_CHARS = 900_000;
    let pendingImage = null;

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => { URL.revokeObjectURL(url); resolve(img); };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("Nie udało się wczytać obrazka.")); };
        img.src = url;
      });
    }

    async function compressImage(file) {
      const img = await loadImage(file);
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      let maxDim = 1600, quality = 0.85;
      for (let i = 0; i < 8; i++) {
        const scale = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight));
        canvas.width = Math.round(img.naturalWidth * scale);
        canvas.height = Math.round(img.naturalHeight * scale);
        ctx.fillStyle = "#fff"; // przezroczyste PNG → białe tło
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        const data = canvas.toDataURL("image/jpeg", quality);
        if (data.length <= MAX_IMAGE_CHARS) return data;
        maxDim = Math.round(maxDim * 0.8);
        quality = Math.max(0.6, quality - 0.05);
      }
      throw new Error("Obrazek jest za duży.");
    }

    $("cardFile").addEventListener("change", async () => {
      const file = $("cardFile").files[0];
      $("cardError").textContent = "";
      pendingImage = null;
      $("cardPreview").classList.add("hidden");
      if (!file) return;
      $("cardFileLabel").textContent = "⏳ Przetwarzanie…";
      try {
        pendingImage = await compressImage(file);
        $("cardPreview").src = pendingImage;
        $("cardPreview").classList.remove("hidden");
        $("cardFileLabel").textContent = "📷 Zmień screen";
      } catch (err) {
        $("cardError").textContent = err.message;
        $("cardFileLabel").textContent = "📷 Wybierz screen karty";
      }
    });

    $("cardForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = $("cardName").value.trim();
      if (!pendingImage) { $("cardError").textContent = "Wybierz screen karty."; return; }
      $("cardSave").disabled = true;
      try {
        await addDoc(cardsCol, { name, image: pendingImage, createdAt: serverTimestamp() });
        $("cardForm").reset();
        pendingImage = null;
        $("cardPreview").classList.add("hidden");
        $("cardFileLabel").textContent = "📷 Wybierz screen karty";
        $("cardError").textContent = "";
      } catch {
        $("cardError").textContent = "Nie udało się zapisać karty. Sprawdź reguły Firestore.";
      } finally {
        $("cardSave").disabled = false;
      }
    });

    function renderCards() {
      $("cards").replaceChildren(...cards.map((c) => {
        const li = document.createElement("li");
        li.tabIndex = 0;
        const img = document.createElement("img");
        img.src = c.image;
        img.alt = "";
        img.loading = "lazy";
        const name = document.createElement("div");
        name.textContent = c.name;
        li.append(img, name);
        li.addEventListener("click", () => openCard(c));
        li.addEventListener("keydown", (e) => { if (e.key === "Enter") openCard(c); });
        return li;
      }));
      $("cardsEmpty").classList.toggle("hidden", cards.length > 0);
      if (viewedCard && !cards.some((c) => c.id === viewedCard.id)) closeCard();
    }

    let viewedCard = null;
    function openCard(c) {
      viewedCard = c;
      $("viewerName").textContent = c.name;
      $("viewerImg").src = c.image;
      $("viewerImg").alt = `Karta ${c.name}`;
      $("viewer").classList.remove("hidden");
      history.pushState({ card: c.id }, "");
    }
    function closeCard() {
      if (!viewedCard) return;
      viewedCard = null;
      $("viewer").classList.add("hidden");
      $("viewerImg").removeAttribute("src");
    }
    // Przycisk "wstecz" na telefonie zamyka podgląd karty zamiast opuszczać aplikację
    window.addEventListener("popstate", closeCard);
    $("viewerClose").addEventListener("click", () => history.back());
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && viewedCard) history.back(); });
    $("viewerDelete").addEventListener("click", () => {
      if (!viewedCard || !confirm(`Usunąć kartę „${viewedCard.name}”?`)) return;
      deleteDoc(doc(db, "cards", viewedCard.id));
      history.back();
    });
  </script>
</body>
</html>
