<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Lista zakupów</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root { --green: #2e7d32; --bg: #f4f6f4; --card: #fff; --text: #1d1d1d; --muted: #8a8a8a; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: var(--bg); color: var(--text); }
    header { background: var(--green); color: #fff; padding: 14px 16px; display: flex;
             align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 1; }
    header h1 { margin: 0; font-size: 1.25rem; }
    header button { background: transparent; color: #fff; border: 1px solid rgba(255,255,255,.6);
                    border-radius: 8px; padding: 6px 10px; font-size: .85rem; cursor: pointer; }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    .hidden { display: none !important; }
    form.add { display: flex; gap: 8px; margin-bottom: 16px; }
    input[type=text], input[type=email], input[type=password] {
      flex: 1; padding: 12px; font-size: 1rem; border: 1px solid #ccc; border-radius: 10px; width: 100%; }
    button.primary { background: var(--green); color: #fff; border: 0; border-radius: 10px;
                     padding: 12px 16px; font-size: 1rem; cursor: pointer; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { background: var(--card); border-radius: 10px; margin-bottom: 8px; display: flex;
         align-items: center; padding: 4px 8px 4px 4px; box-shadow: 0 1px 2px rgba(0,0,0,.06); }
    li label { flex: 1; display: flex; align-items: center; gap: 12px; padding: 10px; cursor: pointer;
               font-size: 1.05rem; word-break: break-word; }
    li input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--green); flex-shrink: 0; }
    li.done label span { text-decoration: line-through; color: var(--muted); }
    li .del { background: none; border: 0; font-size: 1.2rem; color: #c62828; cursor: pointer; padding: 8px; }
    .section { display: flex; justify-content: space-between; align-items: center;
               margin: 20px 0 8px; color: var(--muted); font-size: .9rem; }
    .section button { background: none; border: 0; color: #c62828; cursor: pointer; font-size: .9rem; }
    .empty { text-align: center; color: var(--muted); padding: 24px 0; }
    .login { display: flex; flex-direction: column; gap: 10px; margin-top: 40px; }
    .error { color: #c62828; font-size: .9rem; min-height: 1.2em; }
  </style>
</head>
<body>
  <header>
    <h1>🛒 Lista zakupów</h1>
    <button id="logout" class="hidden">Wyloguj</button>
  </header>

  <main>
    <form id="login" class="login hidden">
      <input type="email" id="email" placeholder="E-mail" autocomplete="username" required>
      <input type="password" id="password" placeholder="Hasło" autocomplete="current-password" required>
      <button class="primary" type="submit">Zaloguj</button>
      <div class="error" id="loginError"></div>
    </form>

    <div id="app" class="hidden">
      <form id="addForm" class="add">
        <input type="text" id="newItem" placeholder="Dodaj produkt…" autocomplete="off" required>
        <button class="primary" type="submit">Dodaj</button>
      </form>
      <ul id="todo"></ul>
      <div id="emptyMsg" class="empty hidden">Lista jest pusta 🎉</div>
      <div id="doneHeader" class="section hidden">
        <span>Kupione</span>
        <button id="clearDone">Usuń kupione</button>
      </div>
      <ul id="done"></ul>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { initializeFirestore, persistentLocalCache, collection, addDoc, updateDoc, deleteDoc,
             doc, onSnapshot, query, orderBy, serverTimestamp, writeBatch }
      from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { firebaseConfig } from "./firebase-config.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    // Lokalny cache: lista działa też w sklepie przy słabym zasięgu
    const db = initializeFirestore(app, { localCache: persistentLocalCache() });
    const itemsCol = collection(db, "items");

    const $ = (id) => document.getElementById(id);
    let unsubscribe = null;
    let currentItems = [];

    onAuthStateChanged(auth, (user) => {
      $("login").classList.toggle("hidden", !!user);
      $("app").classList.toggle("hidden", !user);
      $("logout").classList.toggle("hidden", !user);
      if (user) {
        unsubscribe = onSnapshot(query(itemsCol, orderBy("createdAt", "asc")), (snap) => {
          currentItems = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
          render();
        });
      } else if (unsubscribe) {
        unsubscribe(); unsubscribe = null;
      }
    });

    $("login").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("loginError").textContent = "";
      try {
        await signInWithEmailAndPassword(auth, $("email").value.trim(), $("password").value);
      } catch {
        $("loginError").textContent = "Nieprawidłowy e-mail lub hasło.";
      }
    });

    $("logout").addEventListener("click", () => signOut(auth));

    $("addForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = $("newItem").value.trim();
      if (!name) return;
      addDoc(itemsCol, { name, done: false, createdAt: serverTimestamp() });
      $("newItem").value = "";
      $("newItem").focus();
    });

    $("clearDone").addEventListener("click", () => {
      const done = currentItems.filter((i) => i.done);
      if (!done.length || !confirm(`Usunąć ${done.length} kupionych produktów?`)) return;
      const batch = writeBatch(db);
      done.forEach((i) => batch.delete(doc(db, "items", i.id)));
      batch.commit();
    });

    function itemEl(item) {
      const li = document.createElement("li");
      li.className = item.done ? "done" : "";
      const label = document.createElement("label");
      const cb = document.createElement("input");
      cb.type = "checkbox";
      cb.checked = !!item.done;
      cb.addEventListener("change", () => updateDoc(doc(db, "items", item.id), { done: cb.checked }));
      const span = document.createElement("span");
      span.textContent = item.name;
      label.append(cb, span);
      const del = document.createElement("button");
      del.className = "del";
      del.title = "Usuń";
      del.textContent = "✕";
      del.addEventListener("click", () => deleteDoc(doc(db, "items", item.id)));
      li.append(label, del);
      return li;
    }

    function render() {
      const todo = currentItems.filter((i) => !i.done);
      const done = currentItems.filter((i) => i.done);
      $("todo").replaceChildren(...todo.map(itemEl));
      $("done").replaceChildren(...done.map(itemEl));
      $("emptyMsg").classList.toggle("hidden", todo.length > 0);
      $("doneHeader").classList.toggle("hidden", done.length === 0);
    }
  </script>
</body>
</html>
